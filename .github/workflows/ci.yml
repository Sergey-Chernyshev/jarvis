name: CI

on:
  pull_request:
    branches: [master]
  push:
    # dev — интеграционная ветка: в неё сливают всё, что висит в PR, и
    # проверять её надо так же, как master. Иначе смысл ветки теряется:
    # по отдельности PR зелёные, а вместе могут и не собраться.
    branches: [master, dev]

# Отменяем устаревшие прогоны на той же ветке/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt · clippy · test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install JS deps
        run: npm ci

      # whisper.cpp (фича whisper-native) собирается через CMake.
      - name: Ensure cmake
        run: cmake --version || brew install cmake

      - name: Webview contract tests
        run: |
          npm run test:ui
          node --test scripts/prepare-node-bundle.test.mjs scripts/publish-release.test.mjs

      - name: Ensure ripgrep
        run: rg --version || brew install ripgrep

      - name: Prepare plugin boundary Cargo metadata
        run: |
          cargo fetch --locked --manifest-path crates/jarvis-package/Cargo.toml
          cargo fetch --locked --manifest-path crates/jarvis-plugin-protocol/Cargo.toml
          cargo fetch --locked --manifest-path crates/jarvis-plugin-sdk/Cargo.toml
          cargo fetch --locked --manifest-path crates/jarvis-plugin-test-host/Cargo.toml
          cargo fetch --locked --manifest-path tools/plugin-schema-parity/Cargo.toml
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          cargo fetch --locked --manifest-path src-tauri/shared/Cargo.toml

      - name: Plugin source boundary
        run: |
          bash scripts/check-plugin-boundaries.test.sh
          bash scripts/check-plugin-boundaries.sh
          bash scripts/check-package-lock-contract.test.sh
          bash scripts/check-package-lock-contract.sh

      - name: Plugin package contracts
        run: |
          cargo test --locked --manifest-path crates/jarvis-plugin-protocol/Cargo.toml
          cargo test --locked --manifest-path crates/jarvis-package/Cargo.toml
          cargo test --locked --manifest-path crates/jarvis-plugin-sdk/Cargo.toml
          cargo test --locked --manifest-path crates/jarvis-plugin-test-host/Cargo.toml
          cargo test --locked --manifest-path tools/plugin-schema-parity/Cargo.toml
          cargo test --locked --manifest-path src-tauri/shared/Cargo.toml
          bash scripts/check-plugin-contract-generation.sh
          node --test packages/jarvis-plugin-ui/test/*.test.mjs

      # Информационно: проект использует компактный авторский стиль, не совпадающий
      # с дефолтным rustfmt. Показываем расхождения, но не блокируем мерж.
      - name: Format check (informational)
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Clippy
        run: >
          cargo clippy --manifest-path src-tauri/Cargo.toml
          --features wakeword-ort,whisper-native,stt-vad --all-targets

      - name: Tests
        run: >
          cargo test --manifest-path src-tauri/Cargo.toml
          --features wakeword-ort,whisper-native,stt-vad

      - name: Portable node source package
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --bin jarvis embedded_node_sources_build_offline -- --ignored

      # Узел удалённых агентов — отдельный крейт воркспейса, и фичи приложения к
      # нему неприменимы, поэтому своим шагом. Он же проверяет главное свойство
      # узла: что он собирается БЕЗ tauri и прочих macOS-зависимостей.
      - name: Clippy · tests (узел)
        run: >
          cargo clippy --manifest-path src-tauri/node/Cargo.toml --all-targets &&
          cargo test --manifest-path src-tauri/node/Cargo.toml

  linux:
    name: clippy · test · сборка (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri на Linux рисует через WebKitGTK, трей — через appindicator.
      # cmake нужен whisper.cpp, alsa — cpal (микрофон и воспроизведение).
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libxdo-dev patchelf cmake

      - name: Clippy
        run: >
          cargo clippy --manifest-path src-tauri/Cargo.toml
          --features whisper-native --all-targets

      - name: Tests
        run: >
          cargo test --manifest-path src-tauri/Cargo.toml
          --features whisper-native

      # Главная проверка ветки: бинарь под Linux действительно собирается.
      - name: Сборка
        run: >
          cargo build --manifest-path src-tauri/Cargo.toml
          --release --features whisper-native --bin jarvis

  plugin-msrv:
    name: Plugin public crates · Rust 1.77.2
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.77.2
        with:
          components: clippy
      - name: Public dependency compatibility
        run: |
          cargo test --locked --manifest-path crates/jarvis-plugin-protocol/Cargo.toml
          cargo test --locked --manifest-path crates/jarvis-package/Cargo.toml
          cargo test --locked --manifest-path crates/jarvis-plugin-sdk/Cargo.toml
          cargo test --locked --manifest-path crates/jarvis-plugin-test-host/Cargo.toml
          cargo clippy --locked --manifest-path crates/jarvis-package/Cargo.toml --all-targets -- -D warnings

  node-source-msrv:
    name: Portable node/shared minimum Rust
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80.0
      - name: Isolated node package
        run: |
          python3 scripts/prepare-portable-node.py --out "$RUNNER_TEMP/portable-node"
          cargo test --manifest-path "$RUNNER_TEMP/portable-node/Cargo.toml"
      - uses: dtolnay/rust-toolchain@1.77.2
      - name: Isolated shared utility
        run: cargo test --manifest-path "$RUNNER_TEMP/portable-node/shared/Cargo.toml"
