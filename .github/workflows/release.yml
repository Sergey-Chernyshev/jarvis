name: release

on:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (aarch64 — Apple Silicon)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      # whisper.cpp (whisper-rs, фича whisper-native) собирается через CMake.
      - name: Ensure cmake (whisper-native)
        run: cmake --version || brew install cmake

      - name: Build (ad-hoc sign), updater artifacts, release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc подпись (signingIdentity "-" в tauri.conf) — без Apple Developer.
          # Apple-сертификата у проекта нет; Gatekeeper предупредит один раз.
          # Обновления подписываются ключом Tauri (независимо от Apple).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target aarch64-apple-darwin --features wakeword-ort,whisper-native,stt-vad
          tagName: ${{ github.ref_name }}
          releaseName: Jarvis ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true

  # Узел удалённых агентов. Приложение ставит его на VPS само, и брать бинарь
  # ему неоткуда: у человека с установленным .app нет ни исходников, ни
  # линкера под Linux. Поэтому кладём готовые сборки в тот же релиз — панель
  # качает их прямо на удалённую машину (см. install::remote::release_url).
  node:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            packages: ""
          - target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cross-линкер
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Сборка узла
        working-directory: src-tauri/node
        env:
          # Имя переменной задаёт cargo: TARGET в верхнем регистре, дефисы → _
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target ${{ matrix.target }}
          mv target/${{ matrix.target }}/release/jarvis-node jarvis-node-${{ matrix.target }}

      - name: В релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/node/jarvis-node-${{ matrix.target }}
