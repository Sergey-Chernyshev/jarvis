name: release

on:
  push:
    tags:
      - "v*"

jobs:
  macos:
    needs: node
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (aarch64 — Apple Silicon)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Download nodes built from this exact workflow commit
        uses: actions/download-artifact@v4
        with:
          pattern: jarvis-node-*
          path: node-artifacts

      - name: Verify and prepare embedded Linux nodes
        run: node scripts/prepare-node-bundle.mjs --from node-artifacts

      # whisper.cpp (whisper-rs, фича whisper-native) собирается через CMake.
      - name: Ensure cmake (whisper-native)
        run: cmake --version || brew install cmake

      - name: Read release notes
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -f "docs/release/$RELEASE_TAG.md"
          {
            echo "body<<JARVIS_RELEASE_NOTES_END"
            cat "docs/release/$RELEASE_TAG.md"
            echo "JARVIS_RELEASE_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      - name: Build (ad-hoc sign), updater artifacts, release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc подпись (signingIdentity "-" в tauri.conf) — без Apple Developer.
          # Apple-сертификата у проекта нет; Gatekeeper предупредит один раз.
          # Обновления подписываются ключом Tauri (независимо от Apple).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target aarch64-apple-darwin --features wakeword-ort,whisper-native,stt-vad
          tagName: ${{ github.ref_name }}
          releaseName: Jarvis ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          releaseBody: ${{ steps.notes.outputs.body }}
          uploadUpdaterJson: true

      - name: Attach standalone Linux nodes to the same release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            src-tauri/node-binaries/jarvis-node-*
            src-tauri/node-binaries/manifest.json

      - name: Validate complete draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-release.mjs "$RELEASE_TAG" --check

  # Build both static Linux nodes first. The app embeds these exact sources,
  # so onboarding works even before release assets become downloadable.
  node:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Native musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Cargo cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build and fingerprint current node
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: >-
          node scripts/prepare-node-bundle.mjs --native
          --target ${{ matrix.target }}
          --work "$RUNNER_TEMP/jarvis-node-cross"
          --out "node-artifacts/${{ matrix.target }}"
      - name: Preserve node and manifest for the macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-node-${{ matrix.target }}
          path: node-artifacts/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7
