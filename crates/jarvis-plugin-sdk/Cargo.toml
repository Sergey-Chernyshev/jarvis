[package]
name = "jarvis-plugin-sdk"
version = "0.1.0"
description = "Public Rust SDK for Jarvis plugin runtimes"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
jarvis-plugin-protocol = { version = "0.1.0", path = "../jarvis-plugin-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
