[package]
name = "jarvis-plugin-test-host"
version = "0.1.0"
description = "Executable in-memory contract host for Jarvis plugin tests"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
jarvis-plugin-protocol = { version = "0.1.0", path = "../jarvis-plugin-protocol" }
serde_json = "1"

[dev-dependencies]
jsonschema = { version = "=0.18.3", default-features = false, features = ["draft202012"] }
serde = { version = "1", features = ["derive"] }
time = "=0.3.36"
