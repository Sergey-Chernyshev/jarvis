[package]
name = "jarvis-power-helper"
version = "0.1.0"
description = "Privileged crash-safe coordinator for Jarvis power leases"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[features]
default = []
dev-uds = []
production-xpc = []
unsigned-test = ["production-xpc"]

[build-dependencies]
cc = "1"

[dependencies]
getrandom = "0.2"
jarvis-power-core = { path = "../jarvis-power-core", version = "0.1.0" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = { version = "3", default-features = false }

[[bin]]
name = "jarvis-power-helper-dev"
path = "src/bin/jarvis-power-helper-dev.rs"
required-features = ["dev-uds"]

[[bin]]
name = "jarvis-power-helper"
path = "src/bin/jarvis-power-helper.rs"
required-features = ["production-xpc"]
