[package]
name = "jarvis-secret-store"
version = "0.1.0"
description = "Private credential storage contract shared by Jarvis and first-party sidecars"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11"
