# Jarvis под Sway — готовый кусок конфига.
#
#   include ~/arklual_projects/jarvis/docs/sway/jarvis.conf
#
# или просто скопировать строки в ~/.config/sway/config. Всё, что здесь есть,
# нужно по одной причине: на Wayland приложение не решает ни где ему висеть, ни
# кто получает клавиши, — это решает композитор. Поэтому то, что на macOS делает
# сама панель, здесь делается правилами.
#
# Проверить, каким app_id представляется окно (если правила не сработали):
#   swaymsg -t get_tree | grep -E '"(app_id|name)"' | sort -u

### Панель ⌘J → Ctrl+J и клавиша композитора ###########################
#
# Глобальные хоткеи на Wayland приложению недоступны: клавиатуру раздаёт
# композитор. Поэтому клавишу вешает он, а панели говорит вторым запуском —
# `jarvis --toggle` доходит до уже работающего экземпляра.
bindsym $mod+j exec jarvis --toggle
# Прочее, если нужно: показать, спрятать, выйти.
# bindsym $mod+Shift+j exec jarvis --hide

### Как выглядят окна Jarvis ###########################################
#
# Накладка должна висеть поверх, на всех рабочих столах и не участвовать в
# тайлинге. Размер панель просит сама — sway его уважает у плавающих окон.
for_window [app_id="jarvis"] floating enable, sticky enable, border none

# Тост — то же самое, но он ещё и не имеет права забирать фокус: он приходит
# посреди работы, и увести из редактора курсор было бы худшим, что он может.
no_focus [app_id="jarvis" title="^Jarvis · уведомление$"]

# Чат с агентом и превью — обычные окна: пусть тайлятся как все.
for_window [app_id="jarvis" title="^Jarvis · агент$"] floating disable
for_window [app_id="jarvis" title="^Превью · "] floating disable

### Автозапуск #########################################################
#
# XDG-автозапуск sway сам не читает (это делает dex или systemd --user), а
# у Jarvis есть тумблер «запускать при входе» — он кладёт .desktop в
# ~/.config/autostart. Если dex не стоит, надёжнее строка здесь:
# exec jarvis

### Трей ###############################################################
#
# У sway трея нет — его рисует панель. В waybar это модуль "tray":
#   "modules-right": ["tray", ...],
#   "tray": { "spacing": 8 }
# Без него значок и меню Jarvis просто не появятся, всё остальное работает.
