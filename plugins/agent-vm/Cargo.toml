[package]
name = "jarvis-agent-vm-plugin"
version = "0.1.0"
description = "First-party Jarvis project runtime adapter for agent-vm"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
opt-level = 2
strip = true

