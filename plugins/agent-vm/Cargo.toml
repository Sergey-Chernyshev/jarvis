[package]
name = "jarvis-agent-vm-plugin"
version = "0.1.0"
description = "First-party Jarvis project runtime adapter for agent-vm"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
jarvis-secret-store = { path = "../../crates/jarvis-secret-store" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
toml = "0.8"
uuid = { version = "=1.8.0", features = ["v4"] }
zeroize = "1"

[profile.release]
opt-level = 2
strip = true
