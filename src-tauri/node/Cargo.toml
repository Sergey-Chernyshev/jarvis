[package]
name = "jarvis-node"
version = "1.0.0-beta.1"
description = "Узел Jarvis на удалённой машине: принимает хуки агентов и отдаёт их ноуту через SSH"
license = "MIT"
edition = "2021"
rust-version = "1.80"

# Отдельный крейт, а не [[bin]] в src-tauri, по прозаической причине: cargo
# резолвит зависимости на ПАКЕТ, а не на цель. Внутри src-tauri узел тянул бы
# за собой tauri, objc2 и core-graphics — и не собрался бы на голой Linux-VPS,
# ради которой всё и затевалось. libc нужен только для flock сокета узла.
[dependencies]
jarvis-node-shared = { path = "../shared" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "time", "sync", "io-util"] }
serde_json = "1"
libc = "0.2"
