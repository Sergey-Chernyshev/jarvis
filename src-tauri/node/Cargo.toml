[package]
name = "jarvis-node"
version = "0.3.3"
description = "Узел Jarvis на удалённой машине: принимает хуки агентов и отдаёт их ноуту через SSH"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# Отдельный крейт, а не [[bin]] в src-tauri, по прозаической причине: cargo
# резолвит зависимости на ПАКЕТ, а не на цель. Внутри src-tauri узел тянул бы
# за собой tauri, objc2 и core-graphics — и не собрался бы на голой Linux-VPS,
# ради которой всё и затевалось. Здесь зависимостей ровно три.
[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "time", "sync"] }
serde_json = "1"
