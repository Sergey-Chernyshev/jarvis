<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jarvis · агент</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'" />
<link rel="stylesheet" href="./theme.css" />
<script src="./theme.js"></script>
<style>
  /* Чат с агентом Jarvis · дизайн «Клевер» (14e): бумажная карточка, обе
     реплики одной колонкой с подписью, вопрос — тональной карточкой внутри. */
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font: 400 13.5px/1.6 var(--font);
    color: var(--ink);
    background: var(--paper);
    overflow: hidden;
    display: flex; flex-direction: column;
    border-radius: var(--r-panel);
    box-shadow: var(--shadow-panel);
    -webkit-user-select: none; user-select: none;
  }
  /* шапка 56px, перетаскиваемая */
  header{
    -webkit-app-region: drag; flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px;
    height: var(--h-head); padding: 0 20px;
    border-bottom: 1px solid var(--line);
  }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--accent); flex: none; }
  .title{ font-size:15px; font-weight:600; letter-spacing:-0.01em; }
  .sub{ color: var(--ink-mute); font-size:12.5px; margin-left:auto; font-variant-numeric: tabular-nums; }

  /* лента: подпись сверху, текст колонкой — без пузырей */
  #msgs{ flex:1 1 auto; overflow-y:auto; padding:22px 24px 8px; display:flex; flex-direction:column; gap:18px }
  #msgs::-webkit-scrollbar{ width:0 }
  .msg{ display:flex; flex-direction:column; align-items:flex-start; gap:5px }
  .msg::before{
    content:"jarvis"; font-size:12px; color: var(--ink-mute); font-weight:400;
  }
  .msg.user::before{ content:"ты"; }
  .msg.err::before{ content:"ошибка"; color: var(--danger); }
  .bubble{
    max-width: 100%; padding: 0; border: 0; background: transparent;
    font-size: 14.5px; line-height: 1.6; color: var(--ink);
    white-space: pre-wrap; word-break: break-word;
    text-wrap: pretty;
    -webkit-user-select: text; user-select: text;
  }
  .msg.err .bubble{ color: var(--danger); }
  .chip{
    font-size:12px; color: var(--ink-mute); padding:5px 10px; border-radius:8px;
    background: var(--surface); border:0; font-family: var(--mono);
  }

  /* карточка подтверждения — та же тональная плашка, что и вопрос в чате */
  .msg.confirm{ align-items:stretch }
  .msg.confirm::before{ content:"jarvis · подтверди" }
  .cbox{
    width:100%; padding:16px 18px; border-radius: var(--r-card);
    background: var(--surface); border:0;
  }
  .ctitle{ font-size:15px; font-weight:600; line-height:1.45; margin-bottom:4px; text-wrap:pretty }
  .cdesc{ color: var(--ink-mute); font-size:13px; margin-bottom:8px; -webkit-user-select:text; user-select:text }
  .cwarn{ color: var(--warn); font-size:12.5px; margin-bottom:10px }
  .cbtns{ display:flex; gap:8px }
  .cbtn{
    flex:1; height:38px; border-radius: var(--r-chip); border:0;
    background: var(--paper); color: var(--ink); cursor:default;
    font: 600 13.5px/1 var(--font); box-shadow: var(--shadow-raised);
  }
  .cbtn.yes{ background: var(--accent); color: var(--on-accent); box-shadow:none }
  .cbtn.no{ background: var(--accent-soft); color: var(--ink); box-shadow:none }
  .cbtn:hover{ filter: brightness(1.04) }
  .cresult{ margin-top:8px; font-size:12.5px; color: var(--ink-mute) }
  .hint{ color: var(--ink-faint); text-align:center; font-size:13px; margin:auto; line-height:1.7; max-width:340px }

  /* поле ответа — нижняя полоска панели */
  footer{
    flex:0 0 auto; padding:14px 20px; border-top:1px solid var(--line);
    display:flex; gap:10px; align-items:flex-end;
  }
  #input{
    flex:1; resize:none; max-height:132px; min-height:40px;
    padding:11px 14px; border-radius: var(--r-card); border:0;
    box-shadow: inset 0 0 0 1.5px var(--line-strong);
    background: var(--paper); color: var(--ink); font: inherit; font-size:14px; outline:none;
    -webkit-user-select:text; user-select:text;
  }
  #input::placeholder{ color: var(--ink-faint) }
  #input:focus{ box-shadow: inset 0 0 0 1.5px var(--accent) }
  #send{
    flex:0 0 auto; width:44px; height:40px; border-radius: var(--r-card); border:0;
    background: var(--accent); color: var(--on-accent); font-size:15px; cursor:default;
    transition: filter var(--dur) ease;
  }
  #send:hover{ filter: brightness(1.06) }
  #send:disabled{ opacity:.45 }
</style>
</head>
<body>
  <header data-tauri-drag-region>
    <span class="dot"></span>
    <span class="title">Jarvis · агент</span>
    <span class="sub" id="sub">готов</span>
  </header>
  <div id="msgs">
    <div class="hint">Спроси агента о сессиях, лимитах, метриках.<br/>Действия (ответ в сессию, смена настроек) он подтвердит у тебя карточкой.</div>
  </div>
  <footer>
    <textarea id="input" rows="1" placeholder="Сообщение агенту…  (Enter — отправить)"></textarea>
    <button id="send">⏎</button>
  </footer>
  <script src="agent-chat.js"></script>
</body>
</html>
