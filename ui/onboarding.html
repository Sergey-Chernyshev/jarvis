<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:" />
  <title>Jarvis · Подготовка</title>
  <link rel="stylesheet" href="./theme.css" />
  <link rel="stylesheet" href="./vendor/phosphor/style.css" />
  <link rel="stylesheet" href="./onboarding.css" />
  <script src="./theme.js"></script>
  <script src="./keys.js"></script>
  <script src="./icons.js"></script>
</head>
<body>
  <main class="shell" aria-labelledby="screen-title">
    <header class="titlebar" data-tauri-drag-region>
      <span class="brand" data-tauri-drag-region>Jarvis <span data-tauri-drag-region>Подготовка</span></span>
      <button class="close" id="close" type="button" aria-label="Закрыть подготовку" title="Закрыть · Esc">×</button>
    </header>
    <nav class="rail" id="rail" aria-label="Этапы подготовки">
      <button class="rail-step" type="button" data-screen="welcome"><span class="rail-dot" aria-hidden="true">1</span><span>Знакомство</span></button>
      <button class="rail-step" type="button" data-screen="agents"><span class="rail-dot" aria-hidden="true">2</span><span>Агенты</span></button>
      <button class="rail-step" type="button" data-screen="capabilities"><span class="rail-dot" aria-hidden="true">3</span><span>Голос</span></button>
      <button class="rail-step" type="button" data-screen="ready"><span class="rail-dot" aria-hidden="true">4</span><span>Готово</span></button>
    </nav>
    <section class="content" id="content" tabindex="-1"></section>
    <footer class="footer">
      <div class="footer-actions">
        <button class="btn secondary" id="secondary" type="button" hidden>Назад</button>
        <button class="btn primary" id="primary" type="button">Продолжить</button>
      </div>
      <div class="footer-note"><span id="footer-note">Настройки можно изменить позже</span><span class="keyboard-note"><kbd>esc</kbd> закрыть</span></div>
    </footer>
    <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </main>
  <script src="./onboarding-state.js"></script>
  <script src="./onboarding.js"></script>
</body>
</html>
