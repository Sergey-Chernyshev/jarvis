<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ipc: http://ipc.localhost" />
    <link rel="stylesheet" href="./theme.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        background: transparent;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      /* колонка карточек, прижата к низу; высота = контент (НЕ inset:0).
     inset:0 + justify-content:flex-end ломал измерение: при переполнении
     карточки уходят вверх за край, а scrollHeight верхний оверфлоу не видит —
     окно недомеряло высоту и обрезало верхние карточки. bottom:0 + auto-высота
     даёт корректный scrollHeight. */
      .stack {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px 12px 6px;
      }
      /* та же бумажная карточка, что и панель: краска только на том, кто ждёт */
      .card {
        padding: 15px 18px 16px 20px;
        border-radius: var(--r-panel);
        background: var(--paper);
        border: 0;
        box-shadow: var(--shadow-panel);
        cursor: default;
        opacity: 0;
        transform: translateY(26px) scale(0.96);
        transition:
          opacity 220ms cubic-bezier(0.21, 1.02, 0.55, 1),
          transform 260ms cubic-bezier(0.21, 1.27, 0.45, 1); /* лёгкий овершут */
      }
      .card.in {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      .card.out {
        opacity: 0;
        transform: translateY(14px) scale(0.97);
        transition:
          opacity 170ms ease-in,
          transform 170ms ease-in;
      }
      /* подсветка рамки — только у карточки под курсором (:hover — когда апп
     активен; .hot — из нативного поллинга, когда активно чужое приложение).
     .paused (весь стек) рамку НЕ трогает — иначе не видно, где курсор. */
      .card:hover,
      .card.hot {
        box-shadow:
          var(--shadow-panel),
          0 0 0 1.5px var(--accent-line);
      }

      .crow {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        box-sizing: border-box;
        flex: none;
        background: transparent;
        border: 1.5px solid var(--ink);
      }
      .dot.waiting {
        background: var(--accent);
        border: 0;
      }
      .dot.limit {
        background: var(--ink-faint);
        border: 0;
      }
      .title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
        min-width: 0;
      }
      .close {
        appearance: none;
        position: relative;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: none;
        background: transparent;
        color: var(--ink-faint);
        font-size: 12px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: default;
        flex: none;
      }
      .close:hover,
      .card.hot .close {
        background: var(--fill-2);
        color: var(--ink);
      }

      /* кольцо-таймер: стекает за TTL, на ховере карточки замирает (как таймер) */
      .ring {
        position: absolute;
        inset: 0;
        transform: rotate(-90deg);
        pointer-events: none;
      }
      .ring circle {
        fill: none;
        stroke-width: 2.5;
      }
      .ring .track {
        stroke: var(--surface-2);
      }
      .ring .fg {
        stroke: var(--ink-faint);
        stroke-linecap: round;
        stroke-dasharray: 72.3; /* 2π·11.5 */
        stroke-dashoffset: 0;
        animation: ringDrain var(--ttl, 8000ms) linear forwards;
      }
      @keyframes ringDrain {
        to {
          stroke-dashoffset: 72.3;
        }
      }
      /* пауза кольца: :hover работает, когда приложение активно; .paused — из
     нативного poll'а курсора (когда активно другое приложение) */
      .card:hover .ring .fg,
      .card.paused .ring .fg {
        animation-play-state: paused;
      }
      /* «липкая» карточка вопроса: таймера нет → кольцо-индикатор прячем */
      .card.sticky .ring {
        display: none;
      }

      .body {
        font-size: 13px;
        line-height: 1.55;
        color: var(--ink-mute);
        display: -webkit-box;
        -webkit-line-clamp: 6; /* ИИ-выжимка ответа — до шести строк (короткий текст влезает целиком) */
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin: 7px 36px 0 18px;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
        margin: 6px 36px 0 20px;
        font-size: 12px;
        color: var(--ink-mute);
      }
      .meta .msp {
        color: var(--ink-faint);
      }
      .meta .br {
        color: var(--ink-faint);
        font-size: 11.5px;
      }
      .meta .md {
        color: var(--ink-mute);
      }
      .meta .ef {
        font: 600 10px/1 var(--font);
        color: var(--ink-mute);
        background: var(--surface);
        border: 0;
        border-radius: 5px;
        padding: 3px 6px;
      }
      .cont {
        appearance: none;
        cursor: default;
        margin: 11px 20px 2px;
        padding: 8px 15px;
        border: 0;
        border-radius: var(--r-chip);
        background: var(--accent);
        color: var(--on-accent);
        font: 600 13px/1 var(--font);
        transition: filter 120ms ease;
      }
      .cont:hover {
        filter: brightness(1.06);
      }

      /* варианты вопроса (AskUserQuestion): номерной чип + label + описание.
     Выбор — глобальным хоткеем ⌘⌥1..9 (или кликом). */
      .opts {
        margin: 11px 18px 2px 20px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .opt {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 14px;
        border-radius: var(--r-chip);
        border: 0;
        background: var(--accent-soft);
        cursor: default;
        transition: filter 110ms ease;
      }
      .opt:hover {
        filter: brightness(0.97);
      }
      .opt .num {
        order: 2;
        margin-left: auto;
        flex: none;
        font-size: 13px;
        font-weight: 400;
        color: var(--accent-ink);
        font-variant-numeric: tabular-nums;
      }
      .opt .otext {
        min-width: 0;
        flex: 1;
      }
      .opt .olabel {
        font-size: 13.5px;
        font-weight: 500;
        color: var(--ink);
        line-height: 1.35;
      }
      .opt .odesc {
        font-size: 12px;
        color: var(--ink-mute);
        line-height: 1.45;
        margin-top: 2px;
      }
      .opt .num .key {
        font-size: 10px;
        color: var(--ink-faint);
        margin-right: 2px;
      }

      /* карточка смены режима: компактная, по центру, с «поп»-анимацией */
      .card.mode {
        padding: 13px 18px;
        transition: opacity 180ms ease;
      }
      .card.mode .crow {
        justify-content: center;
      }
      .card.mode .title {
        flex: 0 1 auto;
        text-align: center;
        font-size: 16px;
      }
      .card.mode.in {
        animation: modePop 360ms cubic-bezier(0.21, 1.3, 0.4, 1) both;
      }
      @keyframes modePop {
        0% {
          opacity: 0;
          transform: translateY(8px) scale(0.86);
        }
        55% {
          opacity: 1;
          transform: translateY(0) scale(1.06);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card,
        .card.mode.in {
          transition: none;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
  <!-- внешность до первой отрисовки: theme.js синхронно читает кэш
       и ставит data-* на <html>. Прямой ребёнок body — требование ACL. -->
  <script src="./theme.js"></script>
    <div class="stack" id="stack"></div>
    <script src="./generated/tauri-transport.js"></script>
    <script src="./toast-bridge.js"></script>
    <script src="./toast.js"></script>
  </body>
</html>
